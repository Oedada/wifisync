<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JSON Table</title>
</head>
<body>

<table border="1" id="table">
    <tr>
        <th>Name</th>
        <th>UUID</th>
    </tr>
</table>

<select id="uuid-select"></select>
<button id="connect-btn">Подключиться</button>
<h2 id="status"></h2>

<script>
    const sel = document.getElementById('uuid-select');
    const btn = document.getElementById('connect-btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
        const uuid = sel.value;
        if (!uuid) return;

        status.textContent = 'Подключаемся...';

        try {
            const res = await fetch('/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uuid })
            });
            const data = await res.json();
            status.textContent = `Ответ: ${data.message}`;
        } catch (err) {
            console.error(err);
            status.textContent = 'Ошибка подключения';
        }
    });
    fetch('/devices')
        .then(response => response.json())
        .then(data => {
            const table = document.getElementById('table');
            const sel = document.getElementById('uuid-select');
            for (const key in data) {
                const option = document.createElement('option');
                option.value = data[key];
                option.textContent = key;
                sel.appendChild(option);

                const row = document.createElement('tr');

                const keyCell = document.createElement('td');
                keyCell.textContent = key;

                const valueCell = document.createElement('td');
                valueCell.textContent = data[key];

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                table.appendChild(row);
            }
        })
        .catch(err => {
            console.error('Error:', err);
        });
</script>

</body>
</html>
